# tmux — Ryoku Dark palette
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# status bar
set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=#1c1113,fg=#b99ea0"
set -g status-left "#[bg=#e0707a,fg=#1c1113,bold]  #S #[bg=#1c1113] "
set -g status-left-length 30
set -g status-right "#[fg=#b99ea0]#(ai-usage short)  #[fg=#6b5558]│  #[fg=#f1dcd6]%a %H:%M "
set -g status-right-length 80
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#352328,fg=#e0707a,bold] #I #W "
set -g pane-border-style "fg=#402b30"
set -g pane-active-border-style "fg=#e0707a"
set -g message-style "bg=#352328,fg=#f1dcd6"
